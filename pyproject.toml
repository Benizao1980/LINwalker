[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linwalker"
version = "1.0.17"
description = "LINwalker: exploratory LIN-code analysis and descriptive outbreak summaries"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Ben Pascoe"}]

dependencies = [
  "pandas>=1.5",
  "numpy>=1.21",
  "matplotlib>=3.6",
]

[project.scripts]
linwalker = "linwalker.cli:main"

[tool.setuptools]
packages = ["linwalker"]

[tool.setuptools.package-data]
linwalker = ["data/*"]
